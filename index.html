<!DOCTYPE html>
<html Lang="pt_BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfólio</title>
        <style>
            /* Estilos do portfólio */
            :root {
                --bg: #05070a;
                --fg: #d7e6e2;
                --accent: #6de3c9;
                --dim: #3a4a48;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html, body {
                height: 100%;
                background: var(--bg);
                color: var(--fg);
                font-family: 'Courier New', Courier, monospace;
                overflow: hidden;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }

            /* grid de fundo, sutil, tipo painel de nave */
            .grid {
                position: absolute;
                inset: 0;
                background-image:
                    linear-gradient(var(--dim) 1px, transparent 1px),
                    linear-gradient(90deg, var(--dim) 1px, transparent 1px);
                background-size: 48px 48px;
                opacity: 0.15;
            }

            .content {
                position: relative;
                text-align: center;
                letter-spacing: 0.15em;
            }

            .status {
                font-size: 0.7rem;
                color: var(--dim);
                text-transform: uppercase;
                margin-bottom: 1rem;
                opacity: 0;
                animation: fadeIn 0.6s ease forwards;
            }

             h1 {
                font-size: clamp(1.8rem, 6vw, 3.5rem);
                font-weight: 400;
                color: var(--accent);
                text-shadow: 0 0 20px rgba(109, 227, 201, 0.35);
                opacity: 0;
                animation: fadeIn 1s ease forwards 0.4s;
            }

            .cursor {
            display: inline-block;
            width: 0.5em;
            background: var(--accent);
            margin-left: 0.15em;
            animation: blink 1s step-end infinite;
            }

            @keyframes fadeIn {
                to { opacity: 1; }
            }

            @keyframes blink {
                50% { opacity: 0; }
            }
        </style>
    </head>
    <body>

        <div class="grid"></div>

        <div class="content">   
            <div class="status">AMAZE AMAZE AMAZE</div>
            <h1>Hello, world! teste<span class="cursor"></span></h1> 
        </div>
    </body>
</html>
