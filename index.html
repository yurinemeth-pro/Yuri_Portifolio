<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfólio</title>
        <style>
            /* Estilos do portfólio */
            :root {
                --bg: #05070a;
                --fg: #d7e6e2;
                --accent: #6de3c9;
                --dim: #3a4a48;
            }

            * { margin: 0; padding: 0; box-sizing: border-box; }

            html, body {
                height: 100%;
                background: var(--bg);
                color: var(--fg);
                font-family: 'Courier New', Courier, monospace;
                overflow: hidden;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }

            /* grid de fundo, sutil, tipo painel de nave */
            .grid {
                position: absolute;
                inset: 0;
                background-image:
                linear-gradient(var(--dim) 1px, transparent 1px),
                linear-gradient(90deg, var(--dim) 1px, transparent 1px);
                background-size: 48px 48px;
                opacity: 0.15;
            }

            .content {
                position: relative;
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                letter-spacing: 0.15em;
                transition: opacity 1s ease;
                transform-origin: 50% 50%;
            }

            .status {
                font-size: 0.7rem;
                color: var(--dim);
                text-transform: uppercase;
                margin-bottom: 1rem;
                opacity: 0;
                animation: fadeIn 0.6s ease forwards;
                transition: opacity 0.5s ease;
            }

            h1 {
                position: relative;
                z-index: 3;
                font-size: clamp(1.8rem, 6vw, 3.5rem);
                font-weight: 400;
                color: var(--accent);
                text-shadow: 0 0 20px rgba(109, 227, 201, 0.35);
                opacity: 0;
                animation: fadeIn 1s ease forwards 0.4s;
            }

            .cursor {
                display: inline-block;
                width: 0.5em;
                background: var(--accent);
                margin-left: 0em;
                opacity: 0;
            }

            .cursor.active {
                animation: blink 1s step-end infinite;
            }

            @keyframes fadeIn {
                to { opacity: 1; }
            }

            @keyframes blink {
                0%, 100% {opacity: 1; }
                50% { opacity: 0; }
            }

            .screen-test.visible {
                opacity: 1;
                pointer-events: all;
            }

            .screen-test {
                position: fixed;
                inset: 0;
                background: var(--accent);
                opacity: 0;
                pointer-events: none;
                transition: opacity 1s ease;
                z-index: 2;
            }

            #stringArt {
                width: 100%;
                height: 100%;
                display: block;
            }

            .home {
                position: fixed;
                inset: 0 ;
                opacity: 0;
                pointer-events: none;
                transition: opacity 1s ease;
                z-index: 1;
            }

            .home.visible {
                opacity: 1;
                pointer-events: all;
            }

            .mobile-input {
                position: fixed;
                top: 0;
                left: 0;
                width: 1px;
                height: 1px;
                opacity: 0;
                border: none;
                outline: none;
                font-size: 16px;
            }

            /* ===== Página inicial: cabeçalho + timeline de carreira ===== */
            .home-content {
                height: 100%;
                overflow-y: auto;
                padding: 5rem 1.5rem 4rem;
                max-width: 720px;
                margin: 0 auto;
            }

            .home-header {
                text-align: center;
                margin-bottom: 3.5rem;
            }

            .home-name {
                font-size: 1.4rem;
                letter-spacing: 0.3em;
                color: var(--accent);
                text-shadow: 0 0 15px rgba(109, 227, 201, 0.3);
            }

            .home-role {
                font-size: 0.7rem;
                color: var(--dim);
                letter-spacing: 0.2em;
                text-transform: uppercase;
                margin-top: 0.5rem;
            }

            .timeline {
                position: relative;
                padding-left: 1.5rem;
            }

            .timeline::before {
                content: '';
                position: absolute;
                left: 0;
                top: 0.4rem;
                bottom: 0.4rem;
                width: 1px;
                background: var(--dim);
            }

            .timeline-item {
                position: relative;
                padding-bottom: 2.5rem;
                opacity: 0;
                transform: translateY(12px);
                transition: opacity 0.6s ease, transform 0.6s ease;
            }

            .timeline-item.visible {
                opacity: 1;
                transform: translateY(0);
            }

            .timeline-item::before {
                content: '';
                position: absolute;
                left: -1.5rem;
                top: 0.35rem;
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--dim);
                transform: translateX(-3px);
            }

            .timeline-item.current::before {
                background: var(--accent);
                animation: pulse 2s ease-in-out infinite;
            }

            @keyframes pulse {
                0%, 100% { box-shadow: 0 0 4px var(--accent); }
                50% { box-shadow: 0 0 12px var(--accent); }
            }

            .timeline-date {
                font-size: 0.65rem;
                color: var(--dim);
                letter-spacing: 0.15em;
                text-transform: uppercase;
            }

            .timeline-title {
                font-size: 1rem;
                color: var(--fg);
                margin-top: 0.3rem;
                letter-spacing: 0.05em;
            }

            .timeline-org {
                font-size: 0.75rem;
                color: var(--accent);
                margin-top: 0.15rem;
            }

            .timeline-desc {
                font-size: 0.75rem;
                color: var(--dim);
                line-height: 1.5;
                margin-top: 0.5rem;
                max-width: 46ch;
                letter-spacing: normal;
            }

            .timeline-tag {
                display: inline-block;
                font-size: 0.6rem;
                color: var(--accent);
                border: 1px solid var(--accent);
                padding: 0.15rem 0.5rem;
                border-radius: 2px;
                margin-top: 0.6rem;
                letter-spacing: 0.1em;
            }
            
        </style>
    </head>
    <body>
        <input type="text" class="mobile-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <div class="grid"></div>
        <div class="content">
            <div class="screen-test">
                <canvas id="stringArt"></canvas>
            </div>   
            <div class="status">Inicializando... AMAZE AMAZE AMAZE</div>
            <h1>
                <span class="typed">Hello, world!</span><span class="cursor">&nbsp;</span>
            </h1> 
        </div>
        <div class="home">
            <div class="home-content">
                <header class="home-header">
                    <div class="home-name">YURI NEMETH</div>
                    <div class="home-role">Dados &middot; TI &middot; Sistemas</div>
                </header>
                <div class="timeline" id="timeline"></div>
            </div>
        </div>
        <script>
            // ===== Referências aos elementos do HTML =====
            const status = document.querySelector('.status');
            const typed = document.querySelector('.typed');
            const cursor = document.querySelector('.cursor');
            const screenTest = document.querySelector('.screen-test');
            let helloErased = false;

            const canvas = document.querySelector('#stringArt');
            const ctx = canvas.getContext('2d');
            const totalPins = 400;

            const home = document.querySelector('.home');
            const content = document.querySelector('.content');

            const mobileInput = document.querySelector('.mobile-input');

            const h1 = document.querySelector('h1');

            // ===== Mobile: focar o input escondido no primeiro toque/clique =====
            document.addEventListener('click', function focusOnce() {
                mobileInput.focus();
                document.removeEventListener('click', focusOnce);
            });

            // ===== O que acontece quando "ENTER" é completado =====
            // Isso ESTAVA FALTANDO no seu arquivo — é chamado tanto pelo
            // desktop (evento 'keydown') quanto pelo mobile (evento 'input'),
            // por isso vive numa função própria, reaproveitável pelos dois.
            function triggerEnter() {
                status.style.opacity = 0;
                screenTest.classList.add('visible');

                screenTest.addEventListener('transitionend', function handleFadeIn() {
                    typed.textContent = 'YURI';
                    screenTest.removeEventListener('transitionend', handleFadeIn);
                });

                fetch('pins.txt')
                    .then(function (response) { return response.text(); })
                    .then(function (text) {
                        const pinSequence = text.trim().split(',').map(Number);
                        prepareCanvas();
                        drawStringArt(pinSequence, function () {
                            typeText(typed, '_NEMETH', function () {
                                setTimeout(goHome, 2000);
                            });
                        });
                    });
            }

            // ===== Transição final: "portal" revelando a home =====
            function goHome() {
                home.classList.add('visible');
                content.style.transition = 'none'; // desliga a transition do CSS, o JS assume o controle do fade
                h1.style.animation = 'none';

                const duration = 1400;
                let startTime = null;
                const maxRadius = Math.hypot(window.innerWidth, window.innerHeight) / 2 * 1.1;

                function animate(currentTime) {
                    if (startTime === null) startTime = currentTime;
                    const elapsed = currentTime - startTime;
                    const t = Math.min(elapsed / duration, 1);

                    const eased = t * t * t; // curva acelerada, pro círculo e pro zoom
                    const radius = eased * maxRadius;

                    const mask = 'radial-gradient(circle at 50% 50%, transparent ' + radius + 'px, black ' + radius + 'px)';
                    screenTest.style.webkitMaskImage = mask;
                    screenTest.style.maskImage = mask;

                    content.style.transform = 'scale(' + (1 + eased * 0.15) + ')';
                    h1.style.opacity = 1 - t; // curva LINEAR, só pro fade — mais suave

                    if (t < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        content.style.display = 'none';
                    }
                }

                requestAnimationFrame(animate);
            }

            // ===== Matemática de posição dos pinos no círculo =====
            function getPinPosition(pinIndex) {
                const angle = (pinIndex / totalPins) * Math.PI * 2;
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = Math.min(centerX, centerY) * 0.9;

                return {
                    x: centerX + radius * Math.cos(angle),
                    y: centerY + radius * Math.sin(angle)
                };
            }

            function prepareCanvas() {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.30)';
                ctx.lineWidth = 0.5;
            }

            // ===== Animação da string art, com aceleração exponencial =====
            function drawStringArt(pinSequence, onComplete) {
                const totalLines = pinSequence.length - 1;
                const duration = 8000;
                let startTime = null;
                let linesDrawn = 0;

                function animate(currentTime) {
                    if (startTime === null) startTime = currentTime;
                    const elapsed = currentTime - startTime;
                    const t = Math.min(elapsed / duration, 1);

                    const easedProgress = t === 1 ? 1 : (Math.pow(2, 10 * t - 10));
                    const targetLines = Math.floor(easedProgress * totalLines);

                    while (linesDrawn < targetLines) {
                        const from = getPinPosition(pinSequence[linesDrawn]);
                        const to = getPinPosition(pinSequence[linesDrawn + 1]);

                        ctx.beginPath();
                        ctx.moveTo(from.x, from.y);
                        ctx.lineTo(to.x, to.y);
                        ctx.stroke();

                        linesDrawn++;
                    }

                    if (t < 1) {
                        requestAnimationFrame(animate);
                    } else if (onComplete) {
                        onComplete();
                    }
                }
                requestAnimationFrame(animate);
            }

            // ===== Efeito de digitação automática (usado pro "_NEMETH") =====
            function typeText(element, text, callback) {
                let i = 0;

                function typeNextChar() {
                    if (i < text.length) {
                        element.textContent += text[i];
                        i++;
                        setTimeout(typeNextChar, 120);
                    } else if (callback) {
                        callback();
                    }
                }

                typeNextChar();
            }

            // ===== Troca do subtítulo, 3s após carregar =====
            setTimeout(function () {
                status.style.animation = 'none';
                status.style.opacity = 0;

                setTimeout(function () {
                    status.textContent = 'Type ENTER to enter:';
                    status.style.opacity = 1;
                    cursor.classList.add('active');
                }, 500);
            }, 3000);

            // ===== Teclado físico (desktop): só cuida do Backspace =====
            document.addEventListener('keydown', function (e) {
                mobileInput.focus();

                if (e.key === 'Backspace') {
                    e.preventDefault();
                    typed.textContent = typed.textContent.slice(0, -1);

                    if (typed.textContent === '') {
                        helloErased = true;
                    }
                }
            });

            // ===== Input escondido (funciona em desktop E mobile): cuida das letras =====
            mobileInput.addEventListener('input', function () {
                const value = mobileInput.value;
                mobileInput.value = '';

                if (!value) return;

                const char = value.slice(-1);

                if (helloErased && /^[a-zA-Z]$/.test(char)) {
                    typed.textContent += char.toUpperCase();

                    if (typed.textContent === 'ENTER') {
                        triggerEnter();
                    }
                }
            });

            // ===== Dados da jornada profissional =====
            // Editar aqui conforme novas experiências/cursos forem surgindo.
            const timelineData = [
                {
                    date: '2018 — 2021',
                    title: 'Técnico em Informática para Internet',
                    org: 'ETEC Praia Grande',
                    desc: 'TCC premiado como melhor da área. Atuação em design, documentação e apresentação do projeto, com prototipagem em Figma.'
                },
                {
                    date: '2021 — 2024',
                    title: 'Análise e Desenvolvimento de Sistemas',
                    org: 'FATEC Praia Grande',
                    desc: '4 semestres concluídos. Matrícula pausada para dedicação ao trabalho.'
                },
                {
                    date: '2023',
                    title: 'Atendimento ao público (inglês)',
                    org: 'Intercâmbio — Boston, MA, EUA',
                    desc: 'Atendimento e negociação em inglês, imersão internacional.'
                },
                {
                    date: '2024',
                    title: 'Líder Técnico de Infraestrutura de TI',
                    org: 'Credlar Construtora',
                    desc: ''
                },
                {
                    date: '2024 — 2025',
                    title: 'Técnico de Informática em Infraestrutura',
                    org: 'GS Tecnologia',
                    desc: 'Redes, servidores e suporte técnico.'
                },
                {
                    date: '2025',
                    title: 'Analista de Custos',
                    org: 'Clínica Sion Saúde e Bem Estar',
                    desc: 'Precificação, redução de custos e Excel avançado.'
                },
                {
                    date: '2025 — atual',
                    title: 'Vendedor Júnior de Marcenaria',
                    org: 'Obramax',
                    desc: 'Promovido por mérito a partir de Operador de Caixa, com recordes de atendimento e conversão.',
                    current: true
                },
                {
                    date: 'Em andamento',
                    title: 'Engenharia de QA',
                    org: 'Mate Academy',
                    desc: '',
                    tag: 'EM ANDAMENTO'
                },
                {
                    date: 'Em andamento',
                    title: 'Análise de Dados',
                    org: 'Mate Academy',
                    desc: '',
                    tag: 'EM ANDAMENTO'
                }
            ];

            // ===== Monta a timeline no DOM a partir dos dados acima =====
            function renderTimeline() {
                const container = document.querySelector('#timeline');

                timelineData.forEach(function (item) {
                    const el = document.createElement('div');
                    el.className = 'timeline-item' + (item.current ? ' current' : '');

                    let html = '<div class="timeline-date">' + item.date + '</div>';
                    html += '<div class="timeline-title">' + item.title + '</div>';
                    html += '<div class="timeline-org">' + item.org + '</div>';
                    if (item.desc) html += '<div class="timeline-desc">' + item.desc + '</div>';
                    if (item.tag) html += '<div class="timeline-tag">' + item.tag + '</div>';

                    el.innerHTML = html;
                    container.appendChild(el);
                });

                // Cada item entra suavemente conforme aparece na tela (scroll)
                const observer = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        }
                    });
                }, { threshold: 0.2 });

                document.querySelectorAll('.timeline-item').forEach(function (item) {
                    observer.observe(item);
                });
            }

            renderTimeline();
        </script>
    </body>
</html>
