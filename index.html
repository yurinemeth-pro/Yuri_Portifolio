<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Portfólio</title>
        <style>
            /* Estilos do portfólio */
            :root {
                --bg: #05070a;
                --fg: #d7e6e2;
                --accent: #6de3c9;
                --dim: #3a4a48;
            }

            * { margin: 0; padding: 0; box-sizing: border-box; }

            html, body {
                height: 100%;
                background: var(--bg);
                color: var(--fg);
                font-family: 'Courier New', Courier, monospace;
                overflow: hidden;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }

            /* grid de fundo, sutil, tipo painel de nave */
            .grid {
                position: absolute;
                inset: 0;
                background-image:
                linear-gradient(var(--dim) 1px, transparent 1px),
                linear-gradient(90deg, var(--dim) 1px, transparent 1px);
                background-size: 48px 48px;
                opacity: 0.15;
            }

            .content {
                position: relative;
                text-align: center;
                letter-spacing: 0.15em;
            }

            .status {
                font-size: 0.7rem;
                color: var(--dim);
                text-transform: uppercase;
                margin-bottom: 1rem;
                opacity: 0;
                animation: fadeIn 0.6s ease forwards;
                transition: opacity 0.5s ease;
            }

            h1 {
                font-size: clamp(1.8rem, 6vw, 3.5rem);
                font-weight: 400;
                color: var(--accent);
                text-shadow: 0 0 20px rgba(109, 227, 201, 0.35);
                opacity: 0;
                animation: fadeIn 1s ease forwards 0.4s;
            }

            .cursor {
                display: inline-block;
                width: 0.5em;
                background: var(--accent);
                margin-left: 0em;
                opacity: 0;
            }

            .cursor.active {
                animation: blink 1s step-end infinite;
            }

            @keyframes fadeIn {
                to { opacity: 1; }
            }

            @keyframes blink {
                0%, 100% {opacity: 1; }
                50% { opacity: 0; }
            }

            .screen-test {
            position: fixed;
            inset: 0;
            background: var(--accent);
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            }

            .screen-test.visible {
                opacity: 1;
                pointer-events: all;
            }

            #stringArt {
                width: 100%;
                height: 100%;
                display: block;
            }
            
        </style>
    </head>
    <body>
        <div class="grid"></div>
        <div class="content">
        <div class="screen-test">
            <canvas id="stringArt"></canvas>
        </div>   
        <div class="status">Inicializando... AMAZE AMAZE AMAZE</div>
            <h1>
                <span class="typed">Hello, world!</span><span class="cursor">&nbsp;</span>
            </h1> 
        </div>
        <script>
            const status = document.querySelector('.status');
            const typed = document.querySelector('.typed');
            const cursor = document.querySelector('.cursor');
            const screenTest = document.querySelector('.screen-test');
            let helloErased = false;

            const canvas = document.querySelector('#stringArt');
            const ctx = canvas.getContext('2d');
            const totalPins = 400;

            function getPinPosition(pinIndex) {
                const angle = (pinIndex / totalPins) * Math.PI * 2;
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = Math.min(centerX, centerY) * 0.9;

                return {
                    x: centerX + radius * Math.cos(angle),
                    y: centerY + radius * Math.sin(angle)
                };
            }

            function prepareCanvas() {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.30)';
                ctx.lineWidth = 0.5;
            }

            function drawStringArt(pinSequence, onComplete) {
                const totalLines = pinSequence.length - 1;
                const duration = 8000;
                let startTime = null;
                let linesDrawn = 0;

                function animate(currentTime) {
                    if (startTime === null) startTime = currentTime;
                    const elapsed = currentTime - startTime;
                    const t = Math.min(elapsed / duration, 1);

                    const easedProgress = t === 1 ? 1 : (Math.pow(2, 10 * t - 10));
                    const targetLines = Math.floor(easedProgress * totalLines);

                    while (linesDrawn < targetLines) {
                        const from = getPinPosition(pinSequence[linesDrawn]);
                        const to = getPinPosition(pinSequence[linesDrawn + 1]);

                        ctx.beginPath();
                        ctx.moveTo(from.x, from.y);
                        ctx.lineTo(to.x, to.y);
                        ctx.stroke();

                        linesDrawn++;
                    }

                    if (t < 1) {
                        requestAnimationFrame(animate);
                    } else if (onComplete) {
                        onComplete();
                    }
                }
                requestAnimationFrame(animate);
            }

            function typeText(element, text, callback) {
                let i = 0;

                function typeNextChar() {
                    if (i < text.length) {
                        element.textContent += text[i];
                        i++;
                        setTimeout(typeNextChar, 120);
                    } else if (callback) {
                        callback();
                    }
                }

                typeNextChar();
            }

            setTimeout(function () {
                status.style.animation = 'none';
                status.style.opacity = 0;

                setTimeout(function () {
                    status.textContent = 'Type ENTER to enter:';
                    status.style.opacity = 1;
                    cursor.classList.add('active');
                }, 500);
            }, 3000);

            document.addEventListener('keydown',  function (e) {
                
                if (e.key === 'Backspace') {
                    e.preventDefault();
                    typed.textContent = typed.textContent.slice(0, -1);
                    
                    if (typed.textContent === '') {
                    helloErased = true;
                    }

                    return;
                }

                if (helloErased && /^[a-zA-Z]$/.test(e.key)) {
                    typed.textContent += e.key.toUpperCase();

                    if (typed.textContent === 'ENTER') {
                        screenTest.classList.add('visible');

                        screenTest.addEventListener('transitionend', function handleFadeIn() {
                            typed.textContent = 'YURI';
                            screenTest.removeEventListener('transitionend', handleFadeIn);
                        });

                        fetch('pins.txt')
                            .then(function (response) { return response.text(); })
                            .then(function (text) {
                                const pinSequence = text.trim().split(',').map(Number);
                                prepareCanvas();
                                drawStringArt(pinSequence, function () {
                                    typeText(typed, '_NEMETH', function () {
                                        console.log('YURI_NEMETH completo - próxima etapa: zoom');
                                    });
                                });
                            });
                    }
                }
            }); 
        </script>
    </body>
</html>
